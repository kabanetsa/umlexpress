name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build
        run: swift build --build-tests
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          status=0
          swift test 2>&1 | tee /tmp/test.log || status=$?
          if [ "$status" -ne 0 ]; then
            # Surface the failures as annotations: they are visible without downloading
            # the job log, which only the repository owner can fetch.
            grep -E "(error:|failed \(|✘|Fatal error|Unexpectedly found)" /tmp/test.log \
              | head -n 20 \
              | while IFS= read -r line; do
                  line="${line//'%'/%25}"; line="${line//$'\r'/}"; line="${line//$'\n'/%0A}"
                  echo "::error title=Test failure::${line}"
                done
            tail -n 40 /tmp/test.log | sed 's/^/    /'
            exit 1
          fi
      - name: Deployment target check
        run: |
          obj=$(find .build -name 'Point.swift.o' -path '*UMLGeometry.build*' | head -1)
          echo "object: $obj"
          otool -l "$obj" | grep -A3 LC_BUILD_VERSION
          otool -l "$obj" | grep -q 'minos 26.0'
